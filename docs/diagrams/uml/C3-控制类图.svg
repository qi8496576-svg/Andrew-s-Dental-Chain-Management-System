<svg xmlns="http://www.w3.org/2000/svg" width="2615" height="1376" viewBox="0 0 2615 1376" role="img" aria-label="C3"><rect width="100%" height="100%" fill="white"/><g font-family="SimSun,Times New Roman,serif" fill="black"><rect x="40" y="40" width="600" height="368" rx="0" fill="white" stroke="black" stroke-width="1.5"/><text x="340" y="75" font-size="24" text-anchor="middle">&lt;&lt;control&gt;&gt;</text><text x="340" y="118" font-size="28" text-anchor="middle">预约就诊控制</text><line x1="40" y1="142" x2="640" y2="142" stroke="black" stroke-width="1.5"/><text x="54" y="180" font-size="22" text-anchor="start">+预约就诊(条件)</text><text x="54" y="226" font-size="22" text-anchor="start">+提交预约(时隙,资料,请求标识)</text><text x="54" y="272" font-size="22" text-anchor="start">+保留收费号源(时隙,资料)</text><text x="54" y="318" font-size="22" text-anchor="start">+演示支付并确认预约(账单,请求标识)</text><text x="54" y="364" font-size="22" text-anchor="start">+查询本人费用(条件)</text><rect x="685" y="40" width="600" height="364" rx="0" fill="white" stroke="black" stroke-width="1.5"/><text x="985" y="75" font-size="24" text-anchor="middle">&lt;&lt;control&gt;&gt;</text><text x="985" y="118" font-size="28" text-anchor="middle">管理出诊排班控制</text><line x1="685" y1="142" x2="1285" y2="142" stroke="black" stroke-width="1.5"/><text x="699" y="180" font-size="22" text-anchor="start">+管理出诊排班(牙医,诊所,日期,时段,时隙长度)</text><text x="699" y="226" font-size="22" text-anchor="start">+停诊(班次,原因)</text><rect x="1330" y="40" width="600" height="364" rx="0" fill="white" stroke="black" stroke-width="1.5"/><text x="1630" y="75" font-size="24" text-anchor="middle">&lt;&lt;control&gt;&gt;</text><text x="1630" y="118" font-size="28" text-anchor="middle">记录治疗控制</text><line x1="1330" y1="142" x2="1930" y2="142" stroke="black" stroke-width="1.5"/><text x="1344" y="180" font-size="22" text-anchor="start">+开始记录(就诊)</text><text x="1344" y="226" font-size="22" text-anchor="start">+记录治疗(就诊,项目,单位数,实施时间)</text><text x="1344" y="272" font-size="22" text-anchor="sta