-anchor="middle">核算季度绩效控制</text><line x1="1330" y1="610" x2="1930" y2="610" stroke="black" stroke-width="1.5"/><text x="1344" y="648" font-size="22" text-anchor="start">+准备核算资料(季度,来源资料)</text><text x="1344" y="694" font-size="22" text-anchor="start">+核算季度绩效(季度)</text><text x="1344" y="740" font-size="22" text-anchor="start">+发布结果(牙医,季度,版本,复核人)</text><rect x="1975" y="508" width="600" height="364" rx="0" fill="white" stroke="black" stroke-width="1.5"/><text x="2275" y="543" font-size="24" text-anchor="middle">&lt;&lt;control&gt;&gt;</text><text x="2275" y="586" font-size="28" text-anchor="middle">运营分析控制</text><line x1="1975" y1="610" x2="2575" y2="610" stroke="black" stroke-width="1.5"/><text x="1989" y="648" font-size="22" text-anchor="start">+运营分析(指标,范围,期间)</text><rect x="40" y="972" width="600" height="364" rx="0" fill="white" stroke="black" stroke-width="1.5"/><text x="340" y="1007" font-size="24" text-anchor="middle">&lt;&lt;control&gt;&gt;</text><text x="340" y="1050" font-size="28" text-anchor="middle">确认到诊控制</text><line x1="40" y1="1074" x2="640" y2="1074" stroke="black" stroke-width="1.5"/><text x="54" y="1112" font-size="22" text-anchor="start">+确认到诊(就诊,核实人,请求标识)</text><rect x="685" y="972" width="600" height="364" rx="0" fill="white" stroke="black" stroke-width="1.5"/><text x="985" y="1007" font-size="24" text-anchor="middle">&lt;&lt;control&gt;&gt;</text><text x="985" y="1050" font-size="28" text-anchor="middle">取消预约控制</text><line x1="685" y1="1074" x2="1285" y2="1074" stroke="black" stroke-width="1.5"/><text x="699" y="1112" font-size="22" text-anchor="start">+取消预约(就诊,原因,请求标识)</text><text x="699" y="1158" font-size="22" text-anchor="start">+取消并退还挂号费(就诊,请求标识)</text><rect x="1330" y="972" width="600" height="364" rx="0" fill="white" stroke="black" stroke-width="1.5"/><text x="1630" y="1007" font-size="24" text-anchor="middle">&lt;&lt;control&gt;&gt;</text><text x="1630" y="1050" font-size="28" text-anchor="middle">登记爽约控制</text><line x1="1330" y1="1074" x2=